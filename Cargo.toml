[package]
name = "age-agent"
version = "0.1.0"
edition = "2024"
description = "Caches unlocked age identities in a background process, exposed to age clients as a plugin"
license = "MIT OR Apache-2.0"

[lib]
name = "age_agent"
path = "src/lib.rs"

[[bin]]
name = "age-agent"
path = "src/main.rs"

[[bin]]
name = "age-plugin-agent"
path = "src/bin/age-plugin-agent.rs"

[dependencies]
age = { version = "0.12.1", features = ["armor", "plugin"] }
age-core = "0.12.0"
age-plugin = "0.7.0"
base64 = "0.22"
bech32 = "0.11"
clap = { version = "4", features = ["derive"] }
futures-lite = "2.6.1"
libc = "0.2"
rpassword = "7"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
toml = "0.8"
zbus = "6.2.1"
zeroize = { version = "1", features = ["serde"] }

[profile.release]
lto = true
strip = true
panic = "abort"

[dev-dependencies]
