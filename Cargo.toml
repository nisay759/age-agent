[package]
name = "age-agent"
version = "0.1.0"
edition = "2024"
description = "Caches unlocked age identities in a background process, exposed to age clients as a plugin"
license = "MIT OR Apache-2.0"

[lib]
name = "age_agent"
path = "src/lib.rs"

[[bin]]
name = "age-agent"
path = "src/main.rs"

[[bin]]
name = "age-plugin-agent"
path = "src/bin/age-plugin-agent.rs"

[dependencies]
age = { version = "0.12.1", features = ["armor", "plugin"] }
age-core = "0.12.0"
age-plugin = "0.7.0"
base64 = "0.22"
bech32 = "0.11"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
futures-lite = "2.6.1"
libc = "0.2"
signal-hook = "0.3"
zbus = "6.2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
panic = "abort"

[dev-dependencies]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
